<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
        /* Content dimensions */
        width: 200px;
        height: 100px;
        /* Padding around content */
        padding: 20px;

        /* Border around padding */
        border: 5px solid #333;

        /* Margin around border */
        margin: 30px;

        /* Additional styles for better visualization */
        background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>I'm a paragraph stuck in a box!</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        fieldset {
            width: 350px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        legend {
            background-color: #efefef;
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            padding: 10px 20px;
            color: #333;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Styling for input fields within the fieldset */
        fieldset input {
            margin-bottom: 10px;
            /* Other input styles */
        }
    </style>
</head>
<body>
    <form class="styled-form">
    <fieldset>
        <legend>Personal Information</legend>
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
        <!-- More related fields -->
    </fieldset>
    
    <!-- More fieldsets for other groups -->
</form>
</body>
</html>

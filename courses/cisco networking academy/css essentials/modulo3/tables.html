<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #2d6185;
        }
        
        .basic-table {
            width: 100%;
            border-collapse: collapse; /* Eliminates the space between borders */
        }

        .basic-table th, .basic-table td {
            border: 1px solid #ddd; /* Light gray border */
            padding: 8px; /* Padding for cell content */
            text-align: left; /* Aligns text to the left */
        }

        .basic-table th {
            background-color: #f2f2f2; /* Light gray background for headers */
            color: #333; /* Dark text color for contrast */
        }

        .basic-table2 tr:hover {
            background-color: #f5f5f5; /* Lighter shade for hover effect */
        }

        /* Optional: Alternate row background */
        .basic-table2 tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .table-container {
            overflow-x: auto; /* Enables horizontal scrolling */
        }

        .responsive-table {
            /* Table styles */
            min-width: 600px; /* Minimum width of the table */
        }
    </style>
</head>
<body>
    <table class="basic-table">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    <tr>
        <td>John Doe</td>
        <td>28</td>
        <td>New York</td>
    </tr>
    <!-- More rows -->
</table>

<table class="basic-table2">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    <tr>
        <td>John Doe</td>
        <td>28</td>
        <td>New York</td>
    </tr>
    <!-- More rows -->
</table>

<div class="table-container">
    <table class="responsive-table">
        <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>
    <tr>
        <td>John Doe</td>
        <td>28</td>
        <td>New York</td>
    </tr>
    <!-- More rows -->
    </table>
</div>
</body>
</html>
